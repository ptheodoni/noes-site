<!doctype html>
<!--
  =====================================================================
  ΣΕΛΙΔΑ: Εκδόσεις — Νόες
  Αρχείο: ekdoseis/index.html  (η διεύθυνση είναι noes.gr/ekdoseis/)

  ΠΩΣ ΤΗΝ ΑΛΛΑΖΕΙΣ
  - Άλλαξε μόνο το κείμενο ανάμεσα στο <main> και στο </main>.
  - Η κεφαλίδα (λογότυπο, μενού) και το υποσέλιδο μπαίνουν αυτόματα
    από το assets/site.js — δεν τα γράφεις εδώ.
  - Χρώματα/γραμματοσειρές: assets/style.css (μπλοκ :root).
  - <p>…</p> = παράγραφος, <h2>…</h2> = υπότιτλος,
    <a href="…">…</a> = σύνδεσμος, <b>…</b> = έντονα.
  =====================================================================
-->
<html lang="el" data-root="../" data-page="NEO-ID">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Ο τίτλος στην καρτέλα του browser και στη Google -->
  <title>ΤΙΤΛΟΣ — Νόες</title>
  <!-- Η περιγραφή που δείχνει η Google κάτω από τον τίτλο -->
  <meta name="description" content="Συγγραφή και έκδοση επιστημονικών και φιλοσοφικών συγγραμμάτων.">
  <!-- Η ίδια σελίδα στην άλλη γλώσσα (για το κουμπί English/Ελληνικά) -->
  <meta name="alt-lang" content="en/publications/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Tinos:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/style.css?v=20261017i">
  <link rel="icon" href="../images/favicon.png?v=20261017g">
</head>
<body>
  <!-- Κεφαλίδα: τη γεμίζει αυτόματα το assets/site.js -->
  <header id="site-header"></header>

  <main>
    <!-- ===== ΖΩΝΗ ΤΙΤΛΟΥ (σκούρο μπλε): μικρή ετικέτα, τίτλος, υπότιτλος ===== -->
    <section class="page-head bleed"><div class="wrap">
      <p class="eyebrow">Νόες</p>
      <h1>Εκδόσεις</h1>
      <p class="lead">Συγγραφή και έκδοση επιστημονικών και φιλοσοφικών συγγραμμάτων.</p>
    </div></section>

    <div class="wrap">
      <div class="text">

        <!-- ===== ΠΡΟΣΩΡΙΝΟ ΚΕΙΜΕΝΟ =====
             Όταν έχεις περιεχόμενο, σβήσε το πλαίσιο "notice" πιο κάτω
             και γράψε εδώ τις παραγράφους σου (<p>…</p>). -->
        <div class="notice">
          <b>Σύντομα</b>
          <span>Η σελίδα ετοιμάζεται. Για πληροφορίες: <a href="mailto:info@noes.gr">info@noes.gr</a></span>
        </div>
      </div>
    </div>
  </main>

  <!-- Υποσέλιδο: το γεμίζει αυτόματα το assets/site.js -->
  <footer id="site-footer"></footer>
  <script src="../assets/site.js?v=20261017g"></script>
</body>
</html>
