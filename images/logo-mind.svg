<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Λογότυπο «νους-ερωτηματικό»: ένας εγκέφαλος (λευκό περίγραμμα, χρυσές έλικες)
       που του λείπει ένα στρογγυλό κομμάτι. Το κομμάτι έχει πέσει κάτω και γίνεται
       η τελεία του ερωτηματικού: ίδιο σχήμα και μέγεθος με την «τρύπα», και η χρυσή
       έλικα συνεχίζει μέσα του. Χρώματα: λευκό #ffffff, χρυσό #ecca63. -->

  <!-- ο εγκέφαλος, με την κυκλική τρύπα κάτω αριστερά (κέντρο 85,104 — ακτίνα 22) -->
  <path d="M63 104 C42 101 30 84 37 66 C40 44 60 28 84 29 C99 15 129 16 142 31 C165 33 179 53 173 75 C183 94 170 114 150 116 C141 128 118 132 101.9 118.1 A22 22 0 1 0 63 104 Z" stroke="#ffffff" stroke-width="6"/>
  <!-- αχνό διακεκομμένο περίγραμμα: εδώ ήταν το κομμάτι που λείπει -->
  <path d="M63 104 A22 22 0 0 0 101.9 118.1" stroke="#ffffff" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="2 6"/>
  <!-- έλικες -->
  <path d="M84 50 C96 42 106 58 120 47" stroke="#ecca63" stroke-width="4"/>
  <path d="M132 40 C148 48 140 68 158 72" stroke="#ecca63" stroke-width="4"/>
  <path d="M122 80 C132 95 147 87 153 101" stroke="#ecca63" stroke-width="4"/>
  <!-- αυτή η έλικα «κόβεται» στην τρύπα… -->
  <path d="M50 74 C60 64 70 76 78.2 83.1" stroke="#ecca63" stroke-width="4"/>
  <!-- το εγκεφαλικό στέλεχος = η κάθετη γραμμή του ερωτηματικού -->
  <path d="M113 125 C117 142 109 151 109 165" stroke="#ffffff" stroke-width="6"/>

  <!-- …και συνεχίζει στο κομμάτι που έπεσε (η τελεία), λίγο γυρισμένο -->
  <g transform="translate(26 101) rotate(14 85 104)">
    <circle cx="85" cy="104" r="22" stroke="#ffffff" stroke-width="6"/>
    <path d="M78.2 83.1 C82 92 92 92 90 103 C88 112 96 116 101 113" stroke="#ecca63" stroke-width="4"/>
  </g>
</svg>
