<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- Λογότυπο «νους-ερωτηματικό».
       Εγκέφαλος σε πλάγια όψη (μετωπιαίος λοβός αριστερά, ινιακός δεξιά,
       κροταφικός κάτω, παρεγκεφαλίδα κάτω δεξιά). Από τον κροταφικό λοβό λείπει
       ένα στρογγυλό κομμάτι· έπεσε κάτω και έγινε η τελεία του ερωτηματικού
       (ίδιο σχήμα, ίδιες γραμμές). Το εγκεφαλικό στέλεχος είναι η γραμμή του «?».
       Οι γραμμές είναι διάφανες: φαίνεται το φόντο της σελίδας.
       Χρώμα: #ffffff (άλλαξέ το στο fill πιο κάτω). -->
  <defs>
    <g id="brain">
      <path d="M44 102 Q28.4 91.6 31 73 Q16.9 57.9 36 50 Q41.8 34.4 58 31 Q67.4 12.2 86 22 Q97.9 10.6 112 19 Q125.6 1.7 134 22 Q146.3 18.9 154 29 Q173.2 28.9 172 48 Q188.1 60.8 181 80 Q191.2 96.8 172 101 Q162.5 113.1 148 108 Q143.2 116.5 137 109 Q136.9 116.6 130 120 Q120.1 132.8 104 133 Q89.7 136.0 76 131 Q64.9 124.1 64 111 Q58.5 115.5 54 110 Q46.5 109.1 44 102 Z"/>
      <path d="M130 118 A20 14 0 1 0 170 118 A20 14 0 1 0 130 118 Z"/>
    </g>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round">
        <g stroke-width="5">
      <path d="M60 102 C76 96 92 101 104 95 C114 90 124 87 134 81"/>  
      <path d="M112 20 C110 44 103 58 106 80"/>  
      <path d="M154 30 C150 48 161 58 154 74"/>  
      <path d="M130 107 C142 102 158 102 170 105"/>  
        </g>
        <g stroke-width="3.2">
      <path d="M32 73 C46 63 62 75 78 67"/>
      <path d="M58 32 C64 42 78 52 92 44"/>
      <path d="M68 84 C78 78 88 86 98 80"/>
      <path d="M134 23 C128 36 128 56 136 66"/>
      <path d="M118 72 C127 68 136 76 146 72"/>
      <path d="M163 60 C170 68 170 78 181 80"/>
      <path d="M76 112 C90 106 106 116 124 107"/>
      <path d="M98 126 C108 121 118 125 128 118"/>
      <path d="M134 115 C146 111 158 111 168 115"/>
      <path d="M134 122 C146 119 156 120 166 124"/>
        </g>
      </g>
    </mask>
    <mask id="noHole" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <circle cx="86" cy="121" r="28.6" fill="#000"/>
    </mask>
    <clipPath id="inHole"><circle cx="86" cy="121" r="26"/></clipPath>
  </defs>
  <g fill="#ffffff">
    <!-- ο εγκέφαλος, χωρίς το κομμάτι -->
    <g mask="url(#noHole)"><use href="#brain" mask="url(#cut)"/></g>
    <!-- το εγκεφαλικό στέλεχος -->
    <path d="M126 114 C131 140 118 152 118 172" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <!-- η τελεία = το κομμάτι που έπεσε -->
    <g transform="translate(31 93) rotate(16 86 121)"><g clip-path="url(#inHole)"><use href="#brain" mask="url(#cut)"/></g></g>
  </g>
</svg>
