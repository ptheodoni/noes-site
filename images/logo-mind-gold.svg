<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- Λογότυπο «νους-ερωτηματικό».
       Εγκέφαλος σε πλάγια όψη (μετωπιαίος λοβός αριστερά, ινιακός δεξιά,
       κροταφικός κάτω, παρεγκεφαλίδα κάτω δεξιά). Από τον κροταφικό λοβό λείπει
       ένα στρογγυλό κομμάτι· έπεσε κάτω και έγινε η τελεία του ερωτηματικού
       (ίδιο σχήμα, ίδιες γραμμές). Το εγκεφαλικό στέλεχος είναι η γραμμή του «?».
       Οι γραμμές είναι διάφανες: φαίνεται το φόντο της σελίδας.
       Χρώμα: #ecca63 (άλλαξέ το στο fill πιο κάτω). -->
  <defs>
    <g id="brain">
      <path d="M44 102 Q33.5 100.6 34 90 Q25.1 85.0 30 76 Q24.5 67.5 33 62 Q30.3 52.4 40 50 Q39.7 39.7 50 39 Q52.0 29.0 62 31 Q66.6 21.7 76 26 Q82.0 17.9 90 24 Q95.5 15.5 104 21 Q110.5 13.3 118 20 Q126.5 14.5 132 23 Q141.0 18.1 146 27 Q155.6 24.3 158 34 Q167.8 33.1 168 43 Q177.8 44.3 176 54 Q184.8 57.7 180 66 Q187.7 71.9 181 79 Q186.5 86.7 178 91 Q181.2 99.7 172 101 Q169.2 110.4 160 107 Q154.6 114.7 148 108 Q143.2 115.7 137 109 Q137.2 116.9 130 120 Q126.6 128.0 118 129 Q112.2 135.2 104 133 Q97.3 137.9 90 134 Q82.1 136.8 76 131 Q68.7 129.4 68 122 Q61.9 118.0 64 111 Q58.6 114.9 54 110 Q46.3 109.4 44 102 Z"/>
      <path d="M130 112 C136 104 160 102 174 106 C184 112 180 128 164 131 C148 134 132 128 130 112 Z"/>
    </g>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round">
        <g stroke-width="5">
      <path d="M60 102 C76 96 92 101 104 95 C114 90 124 87 134 81"/>  
      <path d="M112 25 C110 44 103 58 106 80"/>  
      <path d="M153 33 C150 48 161 58 154 74"/>  
      <path d="M128 110 C144 103 162 103 176 107"/>  
        </g>
        <g stroke-width="3.2">
      <path d="M46 72 C56 63 66 75 78 67"/>
      <path d="M60 46 C70 40 80 52 92 44"/>
      <path d="M68 84 C78 78 88 86 98 80"/>
      <path d="M122 46 C130 54 126 62 136 66"/>
      <path d="M118 72 C127 68 136 76 146 72"/>
      <path d="M163 60 C170 70 165 80 174 88"/>
      <path d="M76 112 C90 106 106 116 124 107"/>
      <path d="M98 126 C108 121 118 125 128 118"/>
      <path d="M136 116 C150 112 164 113 176 116"/>
      <path d="M137 122 C150 120 160 122 170 125"/>
        </g>
      </g>
    </mask>
    <mask id="noHole" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <circle cx="86" cy="121" r="28.6" fill="#000"/>
    </mask>
    <clipPath id="inHole"><circle cx="86" cy="121" r="26"/></clipPath>
  </defs>
  <g fill="#ecca63">
    <!-- ο εγκέφαλος, χωρίς το κομμάτι -->
    <g mask="url(#noHole)"><use href="#brain" mask="url(#cut)"/></g>
    <!-- το εγκεφαλικό στέλεχος -->
    <path d="M126 114 C131 140 118 152 118 172" fill="none" stroke="#ecca63" stroke-width="9" stroke-linecap="round"/>
    <!-- η τελεία = το κομμάτι που έπεσε -->
    <g transform="translate(31 93) rotate(16 86 121)"><g clip-path="url(#inHole)"><use href="#brain" mask="url(#cut)"/></g></g>
  </g>
</svg>
