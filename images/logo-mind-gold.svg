<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- Λογότυπο «νους-ερωτηματικό» (logo-mind-gold.svg).
       Ένας εγκέφαλος που του λείπει ένα στρογγυλό κομμάτι· το κομμάτι έχει πέσει
       κάτω και γίνεται η τελεία του ερωτηματικού. Το κομμάτι είναι ΑΚΡΙΒΩΣ το ίδιο
       κομμάτι που λείπει (ίδιο σχήμα, ίδιες αυλακώσεις), απλώς λίγο γυρισμένο.
       Οι αυλακώσεις είναι διάφανες, οπότε φαίνεται το φόντο της σελίδας.
       Χρώμα: άλλαξε το #ecca63 παρακάτω (μία φορά). -->
  <defs>
    <!-- ολόκληρος ο εγκέφαλος (χωρίς το κενό) -->
    <path id="brain" d="M40 112 C24 100 22 76 34 60 C40 38 62 24 86 26 C100 14 128 14 142 28 C164 28 182 46 178 70 C190 86 182 110 162 116 C160 130 140 138 124 132 C116 140 100 140 92 132 C84 136 70 136 62 130 C52 132 42 124 40 112 Z"/>
    <!-- οι αυλακώσεις -->
    <g id="grooves" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round">
      <path d="M70 50 C86 40 100 58 118 46"/>
      <path d="M134 38 C150 46 144 66 162 72"/>
      <path d="M120 84 C132 100 150 92 160 106"/>
      <path d="M34 86 C50 76 62 96 78 104 C90 110 96 124 110 122"/>
    </g>
    <!-- το κομμάτι που λείπει: κύκλος, κέντρο (76,118), ακτίνα 20 -->
    <circle id="hole" cx="76" cy="118" r="20"/>
    <clipPath id="pieceClip"><use href="#hole"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <use href="#grooves"/>
    </mask>
    <mask id="body" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <use href="#grooves"/>
      <use href="#hole" fill="#000" transform="translate(76 118) scale(1.07) translate(-76 -118)"/>
    </mask>
  </defs>
  <g fill="#ecca63">
    <!-- ο εγκέφαλος με το κενό -->
    <use href="#brain" mask="url(#body)"/>
    <!-- το εγκεφαλικό στέλεχος = η γραμμή του ερωτηματικού -->
    <path d="M114 128 C119 148 110 158 110 178" fill="none" stroke="#ecca63" stroke-width="9" stroke-linecap="round"/>
    <!-- το κομμάτι που έπεσε = η τελεία -->
    <g transform="translate(34 94) rotate(20 76 118)">
      <g clip-path="url(#pieceClip)"><use href="#brain" mask="url(#cut)"/></g>
    </g>
  </g>
</svg>
