<!doctype html>
<!--
  =====================================================================
  ΣΕΛΙΔΑ: Ανάγνωση online — Berkeley, Τρεις διάλογοι
  Αρχείο: ekdoseis/berkeley/anagnosi/index.html

  Το βιβλίο εμφανίζεται σελίδα-σελίδα (με το pdf.js, assets/pdfjs/), χωρίς κουμπί λήψης
  ή εκτύπωσης, γιατί το κείμενο είναι ακόμα υπό εξέταση.
  - Για νέα εκδοχή του PDF: αντικατέστησε το αρχείο k-...pdf σε αυτόν τον φάκελο
    (ίδιο όνομα) και άλλαξε το ?v= στη μεταβλητή PDF πιο κάτω.
  - Όταν αποφασίσεις να επιτρέψεις ξανά τη λήψη, το λέμε και επαναφέρουμε το κουμπί.
  - Με ?lang=en η σελίδα δείχνει τα κείμενά της στα αγγλικά (από την αγγλική σελίδα Publications).
  =====================================================================
-->
<html lang="el" data-root="../../../" data-page="ekdoseis">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ανάγνωση: Berkeley, Τρεις διάλογοι — Νόες</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Tinos:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../../assets/style.css?v=20261119a">
  <link rel="icon" href="../../../images/favicon.png?v=20261017g">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head bleed"><div class="wrap">
      <p class="eyebrow"><a href="../../#berkeley" data-t="back" style="color:inherit">← Εκδόσεις</a></p>
      <h1 data-t="h1">George Berkeley · Τρεις διάλογοι</h1>
      <p class="lead" data-t="note">Ανάγνωση online. Το κείμενο είναι ακόμα υπό εξέταση και γι' αυτό δεν διατίθεται για λήψη.</p>
    </div></section>

    <div class="wrap">
      <!-- Εδώ μπαίνουν οι σελίδες του βιβλίου (κάθε σελίδα ένας καμβάς) -->
      <div class="reader" id="reader" oncontextmenu="return false"></div>
      <p class="reader-status" id="status" data-t="loading">Φόρτωση…</p>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../../../assets/site.js?v=20261117c"></script>
  <script src="../../../assets/pdfjs/pdf.min.js"></script>
  <script>
    // ---- Το αρχείο του βιβλίου (άλλαξε το ?v= όταν ανεβάζεις νέα εκδοχή) ----
    var PDF = 'k-7c3ae1d76078.pdf?v=1';

    // ---- Αγγλικά κείμενα όταν η διεύθυνση έχει ?lang=en ----
    if (/lang=en/.test(location.search)) {
      var EN = {
        back: '← Publications',
        h1: 'George Berkeley · Three Dialogues',
        note: 'Read online. The text is still under review, so it is not available for download.',
        loading: 'Loading…'
      };
      document.documentElement.lang = 'en';
      document.querySelectorAll('[data-t]').forEach(function (e) { if (EN[e.dataset.t]) e.textContent = EN[e.dataset.t]; });
      document.querySelector('[data-t="back"]').href = '../../../en/publications/#berkeley';
    }

    // ---- Εμφάνιση σελίδων: κάθε σελίδα σχεδιάζεται μόνο όταν πλησιάζει στην οθόνη ----
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../../../assets/pdfjs/pdf.worker.min.js';
    var reader = document.getElementById('reader'), statusEl = document.getElementById('status');
    pdfjsLib.getDocument({ url: PDF, disableAutoFetch: true }).promise.then(function (pdf) {
      statusEl.remove();
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting || en.target.dataset.done) return;
          en.target.dataset.done = 1; io.unobserve(en.target);
          pdf.getPage(+en.target.dataset.n).then(function (page) {
            var w = en.target.clientWidth, v1 = page.getViewport({ scale: 1 });
            var scale = w / v1.width * Math.min(window.devicePixelRatio || 1, 2);
            var vp = page.getViewport({ scale: scale }), c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            en.target.appendChild(c);
            page.render({ canvasContext: c.getContext('2d'), viewport: vp });
          });
        });
      }, { rootMargin: '800px 0px' });
      for (var i = 1; i <= pdf.numPages; i++) {
        var d = document.createElement('div');
        d.className = 'reader-page'; d.dataset.n = i;
        reader.appendChild(d); io.observe(d);
      }
    }).catch(function (err) { console.error(err); statusEl.textContent = 'Σφάλμα φόρτωσης / Loading error'; });
  </script>
</body>
</html>
